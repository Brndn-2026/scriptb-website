        <script>
        // Fetch the version from the bscript repository
            fetch('https://cdn.jsdelivr.net/gh/Brndn-2026/bscript@main/version.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(version => {
                // Safely update only the version text placeholder, trimming any extra whitespace
                    document.getElementById('version-container').textContent = version.trim();
                })
                .catch(error => {
                    console.error('Error fetching version:', error);
                    document.getElementById('version-container').textContent = 'Unable to fetch version';
                });
    </script>

<script>
    // Only run the deployment check if we are actually on the main index page

    const deploymentUrl = 'https://brndn-2026.github.io/bscript-website/deployed.txt?t=' + new Date().getTime();

    fetch(deploymentUrl)
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.text();
        })
        .then(isdeployed => {
            // Clean up the text completely (lowercase it and remove all whitespace/newlines)
            const status = isdeployed.trim().toLowerCase();
            
            // Print what it actually found to your browser console (Press F12 to check)
            console.log("Deployment status read as:", JSON.stringify(status));

            if (status === 'true') {
                console.log("Site is active.");
            } else {
                console.log("Site is NOT true. Redirecting...");
                window.location.href = "https://brndn-2026.github.io/scriptb-website/notdeployed.html";
            }
        })
        .catch(error => {
            console.error('Error checking deployment status:', error);
        });
    </script>
